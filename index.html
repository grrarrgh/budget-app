<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Pocket Budget</title>

<link rel="apple-touch-icon" sizes="180x180" href="/budget-app/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/budget-app/icon-192.png">
<link rel="manifest" href="/budget-app/manifest.json">

<meta name="theme-color" content="#3157d5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pocket Budget">

<style>
:root{
  font:16px system-ui,sans-serif;
  color:#172033;
  background:#eef2f7;
  --blue:#3157d5;
  --red:#b42318;
  --green:#138a52;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(180deg,#f7f9fc 0%,#eef2f7 100%);
}

header,main{
  max-width:900px;
  margin:auto;
  padding:16px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

h1{
  font-size:1.45rem;
  margin:0;
}

h2{
  font-size:1.1rem;
  margin:24px 0 10px;
}

h3{
  font-size:1rem;
}

.muted{color:#667085}

.mini{font-size:.88rem}

/* Pocket Budget title / Settings button */

.logoButton{
  appearance:none;
  border:0;
  background:none;
  padding:0;
  min-height:auto;
  font:inherit;
  font-size:1.85rem;
  font-weight:800;
  letter-spacing:-.03em;
  color:#1d2939;
  cursor:pointer;
  text-align:left;
}

/* Main controls */

.toolbar,
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:end;
}

.toolbar{
  background:white;
  padding:12px;
  border-radius:14px;
}

.actions{
  margin-top:12px;
}

label{
  display:grid;
  gap:5px;
  font-weight:650;
}

input,
select,
button,
.button{
  font:inherit;
  min-height:44px;
  border-radius:10px;
  border:1px solid #cbd3df;
  padding:9px 12px;
  background:white;
  color:inherit;
}

button,
.button{
  cursor:pointer;
  font-weight:700;
  text-align:center;
}

.primary{
  background:var(--blue);
  color:white;
  border-color:var(--blue);
}

.danger{
  color:var(--red);
}

/* Budget cards */

.grid{
  display:grid;
  gap:12px;
}

.card{
  background:white;
  border:2px solid transparent;
  border-left:6px solid #3157d5;
  border-radius:16px;
  padding:16px;
  box-shadow:
    0 8px 20px rgba(16,24,40,.06),
    0 2px 8px rgba(16,24,40,.08);
}

.card:nth-child(4n+1){
  border-left-color:#3157d5;
  background:#f5f8ff;
}

.card:nth-child(4n+2){
  border-left-color:#138a52;
  background:#f5fcf7;
}

.card:nth-child(4n+3){
  border-left-color:#f79009;
  background:#fffaf0;
}

.card:nth-child(4n+4){
  border-left-color:#7a5af8;
  background:#f8f5ff;
}

.card.over{
  border-color:#f04438;
  background:#fff7f6;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
}

.card h3{
  margin:0;
}

.amount{
  font-size:1.55rem;
  font-weight:800;
}

.overText{
  color:var(--red);
  font-weight:800;
}

.okText{
  color:var(--green);
  font-weight:750;
}

.bar{
  height:10px;
  background:#e9edf3;
  border-radius:999px;
  overflow:hidden;
  margin:12px 0;
}

.bar>span{
  display:block;
  height:100%;
  background:var(--green);
}

.over .bar>span{
  background:var(--red);
}

/* Transactions */

.tx{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:start;
  gap:12px;
  background:white;
  padding:12px;
  border-radius:12px;
  margin:8px 0;
}

.txContent{
  min-width:0;
  overflow-wrap:anywhere;
}

.tx p{
  margin:3px 0;
}

.txActions{
  display:flex;
  flex-direction:column;
  align-items:stretch;
  gap:6px;
  margin-left:auto;
}

.txActions button{
  min-width:76px;
  min-height:38px;
  padding:7px 10px;
}

.dayHeading{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:baseline;
  margin:10px 0 6px;
}

.dayHeading h3{
  margin:0;
}

.emptyDay{
  padding:14px;
  background:white;
  border-radius:12px;
  text-align:center;
}

.txGroup{
  background:#fff;
  border:1px solid #dfe5ee;
  border-radius:12px;
  margin:8px 0;
  overflow:hidden;
}

.txGroup>summary{
  cursor:pointer;
  font-weight:750;
  padding:14px 16px;
  min-height:48px;
}

.txGroup[open]>summary{
  border-bottom:1px solid #e4e7ec;
  background:#f8fafc;
}

.txGroupBody{
  padding:0 8px 4px;
}

.futureGroup{
  border-color:#f5b544;
}

.futureGroup>summary{
  background:#fffaf0;
}

.sectionLabel{
  font-size:.9rem;
  margin:18px 2px 6px;
  color:#475467;
}

/* Currency amount inputs */

.moneyInput{
  display:flex;
  align-items:center;
  gap:8px;
}

.moneyInput input{
  flex:1;
  min-width:0;
}

.currencySymbol{
  font-size:1.15rem;
  font-weight:800;
  min-width:24px;
  text-align:center;
}

/* Settings */

.settingsHeader{
  margin-bottom:20px;
}

.settingsCard{
  background:white;
  padding:16px;
  border-radius:14px;
  box-shadow:
    0 8px 20px rgba(16,24,40,.06),
    0 2px 8px rgba(16,24,40,.08);
}

.settingsCard select{
  width:100%;
}

/* General */

.empty{
  padding:22px;
  background:white;
  border-radius:14px;
  text-align:center;
}

.alert{
  padding:12px;
  border-radius:10px;
  background:#fff0ee;
  color:var(--red);
  margin-bottom:12px;
}

dialog{
  border:0;
  border-radius:16px;
  width:min(92vw,460px);
  padding:0;
  box-shadow:0 18px 60px #0004;
}

dialog::backdrop{
  background:#11182799;
}

form{
  padding:18px;
  display:grid;
  gap:12px;
}

form h2{
  margin:0;
}

.formActions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

.sr{
  position:absolute;
  width:1px;
  height:1px;
  overflow:hidden;
  clip:rect(0,0,0,0);
}

[hidden]{
  display:none !important;
}

@media(min-width:640px){
  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  header,main{
    padding:22px;
  }
}

@media(max-width:420px){
  .logoButton{
    font-size:1.45rem;
  }

  header{
    align-items:flex-start;
  }

  .tx{
    gap:8px;
  }

  .txActions button{
    min-width:70px;
    padding-inline:8px;
  }
}
</style>
</head>

<body>

<header>
  <button
    id="openSettings"
    class="logoButton"
    type="button"
    aria-label="Open Pocket Budget settings"
  >
    💰 Pocket Budget
  </button>

  <span class="muted mini">local only</span>
</header>

<main>

<div id="alert" class="alert" role="alert" hidden></div>

<!-- =========================================================
     MAIN BUDGET VIEW
========================================================= -->

<section id="budgetView">

<section class="toolbar">
  <label>
    Period containing
    <input id="asOf" type="date">
  </label>

  <button id="today" type="button">Today</button>
</section>

<section class="actions">
  <button id="newCategory" class="primary">New category</button>
  <button id="newSpend">Add spending</button>
  <button id="exportBtn">Export backup</button>

  <label class="button">
    Import backup
    <input
      id="importFile"
      class="sr"
      type="file"
      accept="application/json,.json"
    >
  </label>
</section>

<h2>Budgets</h2>

<section
  id="cards"
  class="grid"
  aria-live="polite"
></section>

<h2>Transactions</h2>

<section
  id="transactions"
  aria-live="polite"
></section>

</section>

<!-- =========================================================
     SETTINGS VIEW
========================================================= -->

<section id="settingsView" hidden>

  <div class="settingsHeader">
    <button id="backToBudget" type="button">
      ← Back to Budget
    </button>
  </div>

  <h2>Settings</h2>

  <div class="settingsCard">

    <label>
      Currency
      <select
        id="currency"
        aria-label="Currency"
      ></select>
    </label>

    <p class="muted mini">
      Changing currency changes how amounts are displayed.
      Existing amounts are not converted using exchange rates.
    </p>

  </div>

</section>

</main>

<!-- =========================================================
     CATEGORY DIALOG
========================================================= -->

<dialog id="categoryDialog">

<form id="categoryForm">

<h2 id="categoryTitle">Category</h2>

<input
  id="categoryId"
  type="hidden"
>

<label>
  Name

  <input
    id="categoryName"
    maxlength="30"
    required
  >
</label>

<label>
  Limit

  <div class="moneyInput">

    <span
      id="limitCurrencySymbol"
      class="currencySymbol"
      aria-hidden="true"
    ></span>

    <input
      id="categoryLimit"
      type="number"
      inputmode="decimal"
      min="0.01"
      max="1000000"
      step="0.01"
      required
    >

  </div>
</label>

<label>
  Frequency

  <select id="categoryFrequency">
    <option value="weekly">Weekly</option>
    <option value="monthly">Monthly</option>
  </select>
</label>

<div class="formActions">
  <button type="button" data-close>
    Cancel
  </button>

  <button class="primary">
    Save
  </button>
</div>

</form>

</dialog>

<!-- =========================================================
     SPENDING DIALOG
========================================================= -->

<dialog id="spendDialog">

<form id="spendForm">

<h2 id="spendTitle">Spending</h2>

<input
  id="spendId"
  type="hidden"
>

<label>
  Category

  <select
    id="spendCategory"
    required
  ></select>
</label>

<label>
  Amount

  <div class="moneyInput">

    <span
      id="spendCurrencySymbol"
      class="currencySymbol"
      aria-hidden="true"
    ></span>

    <input
      id="spendAmount"
      type="number"
      inputmode="decimal"
      min="0.01"
      max="1000000"
      step="0.01"
      required
    >

  </div>
</label>

<label>
  Date

  <input
    id="spendDate"
    type="date"
    required
  >
</label>

<label>
  Note (optional)

  <input
    id="spendNote"
    maxlength="120"
  >
</label>

<div class="formActions">

  <button
    type="button"
    data-close
  >
    Cancel
  </button>

  <button class="primary">
    Save
  </button>

</div>

</form>

</dialog>

<script>
"use strict";

/* =========================================================
   CONFIGURATION
========================================================= */

const KEY="budget-pocket.v1";
const MAX_CENTS=100000000;
const WEEK_START=1;
const DEFAULT_CURRENCY="AUD";

const CURRENCIES=[
  {code:"AUD",label:"Australian dollar",symbol:"$"},
  {code:"GBP",label:"British pound",symbol:"£"},
  {code:"EUR",label:"Euro",symbol:"€"},
  {code:"SGD",label:"Singapore dollar",symbol:"$"},
];

const CURRENCY_CODES=
  new Set(CURRENCIES.map(c=>c.code));

const $=s=>document.querySelector(s);

const blank=()=>({
  version:2,
  settings:{
    currency:DEFAULT_CURRENCY
  },
  categories:[],
  transactions:[]
});

let startupError="";
let canStore=storageAvailable();
let state=load();
let money=makeMoney(currentCurrency());

/* =========================================================
   STORAGE
========================================================= */

function storageAvailable(){

  try{

    localStorage.setItem(KEY+".test","1");
    localStorage.removeItem(KEY+".test");

    return true;

  }catch{

    return false;

  }

}

function load(){

  if(!canStore){
    return blank();
  }

  try{

    return validate(
      JSON.parse(
        localStorage.getItem(KEY)||"null"
      )
    );

  }catch{

    startupError=
      "Stored data could not be read. Import a known-good backup.";

    return blank();

  }

}

function save(){

  try{

    localStorage.setItem(
      KEY,
      JSON.stringify(state)
    );

    return true;

  }catch{

    showAlert(
      "Could not save locally. Export a backup and check browser storage settings."
    );

    return false;

  }

}

/* =========================================================
   GENERAL HELPERS
========================================================= */

function showAlert(text){

  const e=$("#alert");

  e.textContent=text;
  e.hidden=!text;

}

function uid(){

  if(crypto?.randomUUID){
    return crypto.randomUUID();
  }

  const a=new Uint32Array(4);

  crypto.getRandomValues(a);

  return [...a]
    .map(x=>x.toString(16))
    .join("-");

}

function esc(v){

  return String(v).replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );

}

/* =========================================================
   DATE HELPERS
========================================================= */

function iso(d){

  return `${d.getFullYear()}-${String(
    d.getMonth()+1
  ).padStart(2,"0")}-${String(
    d.getDate()
  ).padStart(2,"0")}`;

}

function todayISO(){

  return iso(new Date());

}

function localDate(s){

  const [y,m,d]=
    s.split("-").map(Number);

  return new Date(
    y,
    m-1,
    d
  );

}

function validDate(s){

  if(!/^\d{4}-\d{2}-\d{2}$/.test(s)){
    return false;
  }

  const [y,m,d]=
    s.split("-").map(Number);

  const x=
    new Date(y,m-1,d);

  return (
    x.getFullYear()===y &&
    x.getMonth()===m-1 &&
    x.getDate()===d
  );

}

function addDays(d,n){

  const x=new Date(d);

  x.setDate(
    x.getDate()+n
  );

  return x;

}

function formatDate(s){

  return new Intl.DateTimeFormat(
    undefined,
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  ).format(
    localDate(s)
  );

}

function bounds(freq,s){

  const d=localDate(s);

  let start;
  let end;

  if(freq==="weekly"){

    start=addDays(
      d,
      -(
        (
          d.getDay()-
          WEEK_START+
          7
        )%7
      )
    );

    end=addDays(
      start,
      7
    );

  }else{

    start=
      new Date(
        d.getFullYear(),
        d.getMonth(),
        1
      );

    end=
      new Date(
        d.getFullYear(),
        d.getMonth()+1,
        1
      );

  }

  const f=
    new Intl.DateTimeFormat(
      undefined,
      {
        day:"numeric",
        month:"short",
        year:"numeric"
      }
    );

  return{

    start:iso(start),

    end:iso(end),

    label:
      freq==="weekly"
      ?
      `${f.format(start)} – ${f.format(
        addDays(end,-1)
      )}`
      :
      new Intl.DateTimeFormat(
        undefined,
        {
          month:"long",
          year:"numeric"
        }
      ).format(start)

  };

}

/* =========================================================
   CURRENCY
========================================================= */

function currentCurrency(){

  return CURRENCY_CODES.has(
    state?.settings?.currency
  )
  ?
  state.settings.currency
  :
  DEFAULT_CURRENCY;

}

function makeMoney(code){

  return new Intl.NumberFormat(
    undefined,
    {
      style:"currency",
      currency:code,
      currencyDisplay:"narrowSymbol"
    }
  );

}

function currencySymbol(
  code=currentCurrency()
){

  const parts=
    new Intl.NumberFormat(
      undefined,
      {
        style:"currency",
        currency:code,
        currencyDisplay:"narrowSymbol"
      }
    ).formatToParts(0);

  return (
    parts.find(
      p=>p.type==="currency"
    )?.value
    ||
    ""
  );

}

function currencyDecimals(code){

  return Math.min(
    2,
    new Intl.NumberFormat(
      undefined,
      {
        style:"currency",
        currency:code
      }
    )
    .resolvedOptions()
    .maximumFractionDigits
  );

}

function refreshCurrencyUI(){

  const code=currentCurrency();

  const decimals=
    currencyDecimals(code);

  const step=
    decimals===0
    ?
    "1"
    :
    "0.01";

  const min=
    decimals===0
    ?
    "1"
    :
    "0.01";

  const symbol=
    currencySymbol(code);

  money=
    makeMoney(code);

  $("#currency").value=
    code;

  $("#limitCurrencySymbol")
    .textContent=
    symbol;

  $("#spendCurrencySymbol")
    .textContent=
    symbol;

  [
    "#categoryLimit",
    "#spendAmount"
  ].forEach(s=>{

    $(s).step=step;
    $(s).min=min;

  });

}

function parseMoney(v){

  const text=
    String(v).trim();

  const decimals=
    currencyDecimals(
      currentCurrency()
    );

  const pattern=
    decimals===0
    ?
    /^\d+$/
    :
    /^\d+(\.\d{1,2})?$/;

  if(!pattern.test(text)){
    return null;
  }

  const cents=
    Math.round(
      Number(text)*100
    );

  return (
    Number.isSafeInteger(cents) &&
    cents>0 &&
    cents<=MAX_CENTS
  )
  ?
  cents
  :
  null;

}

/* =========================================================
   CATEGORY HELPERS
========================================================= */

function activeCategories(){

  return state.categories
    .filter(
      c=>!c.archivedAt
    )
    .sort(
      (a,b)=>
        a.name.localeCompare(
          b.name
        )
    );

}

function categoryName(t){

  return (
    state.categories.find(
      c=>c.id===t.categoryId
    )?.name
    ||
    t.categoryName
    ||
    "Deleted category"
  );

}

/* =========================================================
   TRANSACTION DISPLAY
========================================================= */

function transactionRow(t){

  return `
    <article class="tx">

      <div class="txContent">

        <strong>
          ${money.format(
            t.amountCents/100
          )}
          ·
          ${esc(
            categoryName(t)
          )}
        </strong>

        <p class="muted mini">
          ${esc(
            formatDate(t.date)
          )}
          ${
            t.note
            ?
            ` · ${esc(t.note)}`
            :
            ""
          }
        </p>

      </div>

      <div class="txActions">

        <button
          data-edit-tx="${t.id}"
        >
          Edit
        </button>

        <button
          class="danger"
          data-delete-tx="${t.id}"
        >
          Delete
        </button>

      </div>

    </article>
  `;

}

function groupTransactions(items){

  const groups=
    new Map();

  items.forEach(t=>{

    if(!groups.has(t.date)){
      groups.set(
        t.date,
        []
      );
    }

    groups
      .get(t.date)
      .push(t);

  });

  for(
    const list
    of groups.values()
  ){

    list.sort(
      (a,b)=>
        b.createdAt.localeCompare(
          a.createdAt
        )
    );

  }

  return groups;

}

function transactionGroup(
  date,
  items,
  {future=false}={}
){

  return `
    <details
      class="txGroup ${
        future
        ?
        "futureGroup"
        :
        ""
      }"
      data-date="${date}"
      ${
        future
        ?
        "open"
        :
        ""
      }
    >

      <summary>
        ${esc(
          formatDate(date)
        )}
        (${items.length})
        ${
          future
          ?
          " · Future-dated"
          :
          ""
        }
      </summary>

      <div class="txGroupBody">

        ${
          items
            .map(transactionRow)
            .join("")
        }

      </div>

    </details>
  `;

}

function renderTransactions(){

  const tx=[
    ...state.transactions
  ].sort(
    (a,b)=>
      b.date.localeCompare(
        a.date
      )
      ||
      b.createdAt.localeCompare(
        a.createdAt
      )
  );

  if(!tx.length){

    $("#transactions")
      .innerHTML=
      `
        <div class="empty">
          No spending entered yet.
        </div>
      `;

    return;

  }

  const today=
    todayISO();

  const groups=
    groupTransactions(tx);

  const todayItems=
    groups.get(today)||[];

  const futureDates=[
    ...groups.keys()
  ]
  .filter(
    d=>d>today
  )
  .sort();

  const pastDates=[
    ...groups.keys()
  ]
  .filter(
    d=>d<today
  )
  .sort(
    (a,b)=>
      b.localeCompare(a)
  );

  let html=`
    <div class="dayHeading">

      <h3>Today</h3>

      <span class="muted mini">
        ${esc(
          formatDate(today)
        )}
        (${todayItems.length})
      </span>

    </div>

    ${
      todayItems.length
      ?
      todayItems
        .map(transactionRow)
        .join("")
      :
      `
        <div class="emptyDay muted">
          No transactions today.
        </div>
      `
    }
  `;

  if(futureDates.length){

    html+=`
      <h3 class="sectionLabel">
        Future-dated
      </h3>

      ${
        futureDates
          .map(
            d=>
              transactionGroup(
                d,
                groups.get(d),
                {future:true}
              )
          )
          .join("")
      }
    `;

  }

  if(pastDates.length){

    html+=`
      <h3 class="sectionLabel">
        Earlier
      </h3>

      ${
        pastDates
          .map(
            d=>
              transactionGroup(
                d,
                groups.get(d)
              )
          )
          .join("")
      }
    `;

  }

  $("#transactions")
    .innerHTML=
    html;

}

/* =========================================================
   MAIN RENDER
========================================================= */

function render(){

  const asOf=
    $("#asOf").value
    ||
    todayISO();

  const cats=
    activeCategories();

  $("#cards").innerHTML=
    cats.length
    ?
    cats.map(c=>{

      const b=
        bounds(
          c.frequency,
          asOf
        );

      const spent=
        state.transactions
          .filter(
            t=>
              t.categoryId===c.id &&
              t.date>=b.start &&
              t.date<b.end
          )
          .reduce(
            (n,t)=>
              n+t.amountCents,
            0
          );

      const remaining=
        c.limitCents-spent;

      const over=
        remaining<0;

      const pct=
        Math.min(
          100,
          Math.round(
            spent/
            c.limitCents*
            100
          )
        );

      return `
        <article
          class="card ${
            over
            ?
            "over"
            :
            ""
          }"
        >

          <div class="row">

            <div>

              <h3>
                ${esc(c.name)}
              </h3>

              <span class="muted mini">
                ${esc(b.label)}
                ·
                ${c.frequency}
              </span>

            </div>

            <strong
              class="${
                over
                ?
                "overText"
                :
                "okText"
              }"
            >
              ${
                over
                ?
                "OVER"
                :
                "ON TRACK"
              }
            </strong>

          </div>

          <p>

            <span class="amount">

              ${
                over
                ?
                `Over by ${
                  money.format(
                    -remaining/100
                  )
                }`
                :
                money.format(
                  remaining/100
                )
              }

            </span>

            ${
              over
              ?
              ""
              :
              "left"
            }

          </p>

          <div
            class="bar"
            role="progressbar"
            aria-valuemin="0"
            aria-valuemax="${c.limitCents}"
            aria-valuenow="${spent}"
          >

            <span
              style="width:${pct}%"
            ></span>

          </div>

          <p class="mini">

            Spent
            ${money.format(
              spent/100
            )}
            of
            ${money.format(
              c.limitCents/100
            )}

          </p>

          <div class="actions">

            <button
              data-add="${c.id}"
            >
              Add spend
            </button>

            <button
              data-edit-cat="${c.id}"
            >
              Edit
            </button>

            <button
              class="danger"
              data-delete-cat="${c.id}"
            >
              Delete
            </button>

          </div>

        </article>
      `;

    }).join("")
    :
    `
      <div class="empty">
        Create a category to start budgeting.
      </div>
    `;

  renderTransactions();

}

/* =========================================================
   CATEGORY DIALOG
========================================================= */

function openCategory(id=""){

  const c=
    state.categories.find(
      x=>x.id===id
    );

  $("#categoryForm")
    .reset();

  $("#categoryId").value=
    c?.id||"";

  $("#categoryName").value=
    c?.name||"";

  const decimals=
    currencyDecimals(
      currentCurrency()
    );

  $("#categoryLimit").step=
    decimals===0
    ?
    "1"
    :
    "0.01";

  $("#categoryLimit").min=
    decimals===0
    ?
    "1"
    :
    "0.01";

  $("#categoryLimit").value=
    c
    ?
    (
      c.limitCents/100
    ).toFixed(decimals)
    :
    "";

  $("#categoryFrequency").value=
    c?.frequency
    ||
    "weekly";

  $("#categoryTitle").textContent=
    c
    ?
    "Edit category"
    :
    "New category";

  $("#categoryDialog")
    .showModal();

}

/* =========================================================
   SPENDING DIALOG
========================================================= */

function fillCategorySelect(
  selected=""
){

  const cats=
    state.categories
      .filter(
        c=>
          !c.archivedAt
          ||
          c.id===selected
      );

  $("#spendCategory")
    .innerHTML=
    cats
      .sort(
        (a,b)=>
          a.name.localeCompare(
            b.name
          )
      )
      .map(
        c=>
          `
            <option value="${c.id}">
              ${esc(c.name)}
              ${
                c.archivedAt
                ?
                " (deleted)"
                :
                ""
              }
            </option>
          `
      )
      .join("");

}

function openSpend(
  id="",
  cat=""
){

  const t=
    state.transactions.find(
      x=>x.id===id
    );

  const locked=
    Boolean(
      cat &&
      !t
    );

  const selected=
    t?.categoryId
    ||
    cat
    ||
    activeCategories()[0]?.id
    ||
    "";

  $("#spendForm")
    .reset();

  fillCategorySelect(
    selected
  );

  $("#spendId").value=
    t?.id||"";

  $("#spendCategory").value=
    selected;

  $("#spendCategory").disabled=
    locked;

  const decimals=
    currencyDecimals(
      currentCurrency()
    );

  $("#spendAmount").step=
    decimals===0
    ?
    "1"
    :
    "0.01";

  $("#spendAmount").min=
    decimals===0
    ?
    "1"
    :
    "0.01";

  $("#spendAmount").value=
    t
    ?
    (
      t.amountCents/100
    ).toFixed(decimals)
    :
    "";

  $("#spendDate").value=
    t?.date
    ||
    $("#asOf").value
    ||
    todayISO();

  $("#spendNote").value=
    t?.note
    ||
    "";

  $("#spendTitle").textContent=
    t
    ?
    "Edit spending"
    :
    "Add spending";

  $("#spendDialog")
    .showModal();

}

/* =========================================================
   CATEGORY SAVE
========================================================= */

$("#categoryForm")
  .onsubmit=e=>{

    e.preventDefault();

    const id=
      $("#categoryId").value;

    const name=
      $("#categoryName")
        .value
        .trim();

    const limit=
      parseMoney(
        $("#categoryLimit").value
      );

    const frequency=
      $("#categoryFrequency").value;

    if(!limit){

      return showAlert(
        "Enter a valid positive limit."
      );

    }

    if(
      activeCategories()
        .some(
          c=>
            c.id!==id &&
            c.name.toLowerCase()===
            name.toLowerCase()
        )
    ){

      return showAlert(
        "Category names must be unique."
      );

    }

    if(id){

      Object.assign(
        state.categories.find(
          c=>c.id===id
        ),
        {
          name,
          limitCents:limit,
          frequency,
          updatedAt:
            new Date()
              .toISOString()
        }
      );

    }else{

      state.categories.push({
        id:uid(),
        name,
        limitCents:limit,
        frequency,
        createdAt:
          new Date()
            .toISOString(),
        updatedAt:
          new Date()
            .toISOString(),
        archivedAt:null
      });

    }

    showAlert("");

    save();

    $("#categoryDialog")
      .close();

    render();

  };

/* =========================================================
   SPENDING SAVE
========================================================= */

$("#spendForm")
  .onsubmit=e=>{

    e.preventDefault();

    const id=
      $("#spendId").value;

    const categoryId=
      $("#spendCategory").value;

    const amount=
      parseMoney(
        $("#spendAmount").value
      );

    const date=
      $("#spendDate").value;

    const note=
      $("#spendNote")
        .value
        .trim();

    const cat=
      state.categories.find(
        c=>c.id===categoryId
      );

    if(
      !cat ||
      !amount ||
      !validDate(date)
    ){

      return showAlert(
        "Check the category, amount and date."
      );

    }

    if(id){

      Object.assign(
        state.transactions.find(
          t=>t.id===id
        ),
        {
          categoryId,
          categoryName:cat.name,
          amountCents:amount,
          date,
          note,
          updatedAt:
            new Date()
              .toISOString()
        }
      );

    }else{

      state.transactions.push({
        id:uid(),
        categoryId,
        categoryName:cat.name,
        amountCents:amount,
        date,
        note,
        createdAt:
          new Date()
            .toISOString(),
        updatedAt:
          new Date()
            .toISOString()
      });

    }

    showAlert("");

    save();

    $("#spendDialog")
      .close();

    render();

  };

/* =========================================================
   BUDGET CARD ACTIONS
========================================================= */

$("#cards")
  .onclick=e=>{

    const b=
      e.target.closest(
        "button"
      );

    if(!b){
      return;
    }

    if(b.dataset.add){

      openSpend(
        "",
        b.dataset.add
      );

    }

    if(b.dataset.editCat){

      openCategory(
        b.dataset.editCat
      );

    }

    if(
      b.dataset.deleteCat &&
      confirm(
        "Delete this category? Its transactions will remain in history."
      )
    ){

      state.categories.find(
        c=>
          c.id===
          b.dataset.deleteCat
      ).archivedAt=
        new Date()
          .toISOString();

      save();
      render();

    }

  };

/* =========================================================
   TRANSACTION ACTIONS
========================================================= */

$("#transactions")
  .onclick=e=>{

    const b=
      e.target.closest(
        "button"
      );

    if(!b){
      return;
    }

    if(b.dataset.editTx){

      openSpend(
        b.dataset.editTx
      );

    }

    if(
      b.dataset.deleteTx &&
      confirm(
        "Delete this spending entry?"
      )
    ){

      state.transactions=
        state.transactions.filter(
          t=>
            t.id!==
            b.dataset.deleteTx
        );

      save();
      render();

    }

  };

/* =========================================================
   MAIN BUTTONS
========================================================= */

$("#newCategory")
  .onclick=
  ()=>openCategory();

$("#newSpend")
  .onclick=
  ()=>
    activeCategories().length
    ?
    openSpend()
    :
    openCategory();

$("#today")
  .onclick=()=>{

    $("#asOf").value=
      todayISO();

    render();

  };

$("#asOf")
  .onchange=
  render;

document
  .querySelectorAll(
    "[data-close]"
  )
  .forEach(
    b=>
      b.onclick=
      ()=>
        b.closest(
          "dialog"
        ).close()
  );

/* =========================================================
   SETTINGS NAVIGATION
========================================================= */

function handleNavigation(){

  const settings=
    location.hash===
    "#settings";

  $("#budgetView").hidden=
    settings;

  $("#settingsView").hidden=
    !settings;

  if(settings){

    document.title=
      "Settings · Pocket Budget";

  }else{

    document.title=
      "Pocket Budget";

  }

  window.scrollTo(
    0,
    0
  );

}

$("#openSettings")
  .onclick=()=>{

    if(
      location.hash!==
      "#settings"
    ){

      location.hash=
        "settings";

    }else{

      handleNavigation();

    }

  };

$("#backToBudget")
  .onclick=()=>{

    location.hash="";

  };

window.addEventListener(
  "hashchange",
  handleNavigation
);

/* =========================================================
   CURRENCY SETTING
========================================================= */

$("#currency")
  .onchange=e=>{

    const code=
      e.target.value;

    if(
      !CURRENCY_CODES.has(
        code
      )
    ){
      return;
    }

    state.settings.currency=
      code;

    refreshCurrencyUI();

    showAlert("");

    save();

    render();

  };

/* =========================================================
   EXPORT BACKUP
========================================================= */

$("#exportBtn")
  .onclick=()=>{

    const data={
      app:"budget-pocket",
      version:2,
      exportedAt:
        new Date()
          .toISOString(),
      data:state
    };

    const blob=
      new Blob(
        [
          JSON.stringify(
            data,
            null,
            2
          )
        ],
        {
          type:
            "application/json"
        }
      );

    const url=
      URL.createObjectURL(
        blob
      );

    const a=
      document.createElement(
        "a"
      );

    a.href=url;

    a.download=
      `budget-pocket-${todayISO()}.json`;

    a.click();

    setTimeout(
      ()=>
        URL.revokeObjectURL(
          url
        ),
      1000
    );

  };

/* =========================================================
   IMPORT BACKUP
========================================================= */

$("#importFile")
  .onchange=
  async e=>{

    const file=
      e.target.files[0];

    e.target.value="";

    if(!file){
      return;
    }

    if(
      file.size>
      2000000
    ){

      return showAlert(
        "Backup is too large."
      );

    }

    try{

      const next=
        validate(
          JSON.parse(
            await readText(
              file
            )
          )
        );

      if(
        !confirm(
          "Replace all current data with this backup?"
        )
      ){
        return;
      }

      const old=
        state;

      state=
        next;

      refreshCurrencyUI();

      if(!save()){

        state=
          old;

        refreshCurrencyUI();

        return;

      }

      showAlert("");

      render();

    }catch(err){

      showAlert(
        "Import failed: "+
        err.message
      );

    }

  };

function readText(file){

  return new Promise(
    (
      resolve,
      reject
    )=>{

      const r=
        new FileReader();

      r.onload=
        ()=>
          resolve(
            r.result
          );

      r.onerror=
        ()=>
          reject(
            new Error(
              "Could not read file"
            )
          );

      r.readAsText(
        file
      );

    }
  );

}

/* =========================================================
   BACKUP / STORAGE VALIDATION
========================================================= */

function validate(raw){

  if(!raw){
    return blank();
  }

  const x=
    raw.app===
    "budget-pocket"
    ?
    raw.data
    :
    raw;

  if(
    !x ||
    !Array.isArray(
      x.categories
    ) ||
    !Array.isArray(
      x.transactions
    )
  ){

    throw new Error(
      "Not a Pocket Budget backup"
    );

  }

  if(
    x.categories.length>200 ||
    x.transactions.length>10000
  ){

    throw new Error(
      "Too many records"
    );

  }

  /*
   Older versions did not have
   settings.currency.

   They used AUD, so old data
   automatically migrates to AUD.
  */

  const currency=
    CURRENCY_CODES.has(
      x.settings?.currency
    )
    ?
    x.settings.currency
    :
    DEFAULT_CURRENCY;

  const ids=
    new Set();

  const names=
    new Set();

  const categories=
    x.categories.map(c=>{

      const name=
        String(
          c.name||""
        ).trim();

      const key=
        name.toLowerCase();

      const archived=
        Boolean(
          c.archivedAt
        );

      if(
        !c.id ||
        ids.has(c.id) ||
        !name ||
        (
          !archived &&
          names.has(key)
        ) ||
        name.length>40 ||
        !Number.isSafeInteger(
          c.limitCents
        ) ||
        c.limitCents<1 ||
        c.limitCents>
          MAX_CENTS ||
        ![
          "weekly",
          "monthly"
        ].includes(
          c.frequency
        )
      ){

        throw new Error(
          "Invalid category data"
        );

      }

      ids.add(
        c.id
      );

      if(!archived){

        names.add(
          key
        );

      }

      return{
        id:String(c.id),
        name,
        limitCents:
          c.limitCents,
        frequency:
          c.frequency,
        createdAt:
          String(
            c.createdAt||""
          ),
        updatedAt:
          String(
            c.updatedAt||""
          ),
        archivedAt:
          c.archivedAt
          ?
          String(
            c.archivedAt
          )
          :
          null
      };

    });

  const txids=
    new Set();

  const transactions=
    x.transactions.map(t=>{

      const note=
        String(
          t.note||""
        );

      if(
        !t.id ||
        txids.has(t.id) ||
        !ids.has(
          t.categoryId
        ) ||
        !Number.isSafeInteger(
          t.amountCents
        ) ||
        t.amountCents<1 ||
        t.amountCents>
          MAX_CENTS ||
        !validDate(
          t.date
        ) ||
        note.length>120
      ){

        throw new Error(
          "Invalid transaction data"
        );

      }

      txids.add(
        t.id
      );

      return{
        id:String(t.id),
        categoryId:
          String(
            t.categoryId
          ),
        categoryName:
          String(
            t.categoryName||""
          ),
        amountCents:
          t.amountCents,
        date:t.date,
        note,
        createdAt:
          String(
            t.createdAt||""
          ),
        updatedAt:
          String(
            t.updatedAt||""
          )
      };

    });

  return{
    version:2,
    settings:{
      currency
    },
    categories,
    transactions
  };

}

/* =========================================================
   INITIALISE
========================================================= */

$("#currency")
  .innerHTML=
  CURRENCIES
    .map(
      c=>
        `
          <option value="${c.code}">
            ${c.symbol} — ${c.label} (${c.code})
          </option>
        `
    )
    .join("");

$("#asOf").value=
  todayISO();

refreshCurrencyUI();

if(!canStore){

  showAlert(
    "Local storage is unavailable. Enable browser storage before entering data."
  );

}else if(startupError){

  showAlert(
    startupError
  );

}

render();

handleNavigation();

</script>
